name: Release

# Push a tag like v2.0.0 (matching version.py) to build HyperHeadset.exe
# and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag matches version.py
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from version import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{__version__}":
              sys.exit(f"Tag {tag} does not match version.py ({__version__})")

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm HyperHeadset.spec

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/HyperHeadset.exe
          generate_release_notes: true
